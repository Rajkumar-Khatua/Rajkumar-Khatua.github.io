<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Case Study | Rajkumar Khatua</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://kj3bgy2n.api.sanity.io" crossorigin />
    <link rel="preconnect" href="https://cdn.sanity.io" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@200;300;400;500;600&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="assets/css/post.css" />
    <link rel="stylesheet" href="assets/css/navbar.css" />
    <script>const savedTheme = localStorage.getItem('theme') || 'light'; document.documentElement.setAttribute('data-theme', savedTheme);</script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/navbar.js"></script>
</head>
<body>
    <div class="cursor" id="cursor"></div>
    <div class="cursor-ring" id="cursorRing"></div>

    <div id="navbar-container"></div>

    <section class="article-shell">
        <div class="article-wrap">
            <a href="blog.html" class="back-link">← Back to Case Studies</a>

            <div id="status" class="status-box">Loading post...</div>

            <article id="postContainer" class="article-card" style="display:none;">
                <div class="article-header">
                    <div class="article-meta-top">
                        <span id="postDate" class="article-date"></span>
                        <span class="article-dot"></span>
                        <span class="article-label">Case Study</span>
                    </div>
                    <h1 id="postTitle" class="article-title"></h1>
                    <p id="postExcerpt" class="article-excerpt"></p>
                </div>

                <div id="coverWrap" class="article-cover-wrap" style="display:none;">
                    <img id="postImage" class="article-cover" alt="" />
                </div>

                <div class="article-body-wrap">
                    <div id="postBody" class="content"></div>
                </div>

                <div class="article-footer">
                    <a href="blog.html" class="article-footer-link">← Back to Case Studies</a>
                </div>
            </article>
        </div>
    </section>

    <footer>
        <div class="footer-inner">
            <div class="footer-logo">Rajkumar Khatua<span>.</span></div>
            <div class="footer-right">© 2026 | BI & Zoho Analytics Specialist | Kolkata, India</div>
        </div>
    </footer>

    <script src="assets/js/post.js"></script>

    <button id="scrollToTop" class="scroll-to-top" aria-label="Scroll to top">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
    </button>
    <script src="assets/js/scroll_top.js"></script>
